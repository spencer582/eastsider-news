name: Publish Eastsider review website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: eastsider-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the public preview dependencies
        run: |
          npm ci --prefix preview --ignore-scripts --no-audit --no-fund
          ln -s preview/node_modules node_modules
      - name: Build the public reader website
        env:
          PREVIEW_SITE_URL: https://${{ github.repository_owner }}.github.io/eastsider-news
        run: node scripts/build-github-pages.mjs
      - name: Check pages, metadata, assets and event downloads
        run: node scripts/test-github-pages.mjs
      - name: Upload the public website
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the public website
        id: deployment
        uses: actions/deploy-pages@v4
